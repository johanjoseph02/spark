[project]
name = "spark"
version = "0.2.0"
description = "Camera-based parking occupancy on affordable hardware, with live availability, demand-responsive pricing and an operator dashboard."
readme = "README.md"
authors = [
    { name = "Johan Mathew Joseph", email = "johanmathewjoseph@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.10,<5",
    "onnxruntime>=1.20",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
train = [
    "torch>=2.5",
    "onnx>=1.17",
    "onnxscript>=0.1",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[project.scripts]
spark = "spark.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"
exclude = ["src/spark/vision/train\\.py", "src/spark/vision/cnn\\.py", "src/spark/vision/export\\.py", "src/spark/bench/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["train: needs the train extra (torch, onnx)"]
