<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPARK: map a car park</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .stage { position: relative; overflow: auto; border-radius: 10px; border: 1px solid var(--line); }
    .stage img, .stage svg { display: block; max-width: none; }
    .stage svg { position: absolute; inset: 0; cursor: crosshair; }
    .stage polygon { fill: color-mix(in srgb, var(--free) 35%, transparent); stroke: var(--free); stroke-width: 2; }
    .stage polygon.sel { fill: color-mix(in srgb, var(--accent) 35%, transparent); stroke: var(--accent); }
    .stage circle { fill: var(--accent); }
    .stage text { fill: #fff; font: 600 13px system-ui; paint-order: stroke; stroke: #000; stroke-width: 3px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    textarea { width: 100%; min-height: 160px; font: 12px ui-monospace, monospace; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  </style>
</head>
<body>
  <header class="top"><span class="brand">SPARK<small>map a car park</small></span></header>
  <main class="grid">
    <section class="card grid">
      <p class="muted small">Load a still from the camera. Click the four corners of each bay, in any
        order; the fourth click closes the bay. Everything stays in this browser.</p>
      <div class="row">
        <input id="file" type="file" accept="image/*" aria-label="Camera still">
        <label>Lot id <input id="lotId" value="my-lot" size="12"></label>
        <label>Name <input id="lotName" value="My car park" size="18"></label>
        <label>Zone <input id="zone" value="main" size="8"></label>
        <label>Lat <input id="lat" size="9" inputmode="decimal"></label>
        <label>Lon <input id="lon" size="9" inputmode="decimal"></label>
      </div>
      <div class="row">
        <button id="undo" type="button">Undo last point or bay</button>
        <button id="clear" type="button">Clear</button>
        <button id="download" class="primary" type="button">Download lot JSON</button>
        <span id="count" class="muted small"></span>
      </div>
      <div class="stage" id="stage"><p class="empty">No image loaded.</p></div>
      <label for="out" class="small muted">Lot JSON (save as <code>configs/lots/&lt;id&gt;.json</code>)</label>
      <textarea id="out" readonly></textarea>
    </section>
  </main>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    const NS = "http://www.w3.org/2000/svg";
    let size = null, bays = [], pending = [];

    function json() {
      const lat = parseFloat($("lat").value), lon = parseFloat($("lon").value);
      return JSON.stringify({
        id: $("lotId").value.trim(), name: $("lotName").value.trim(),
        frame_size: size ?? [0, 0], lat: Number.isFinite(lat) ? lat : null,
        lon: Number.isFinite(lon) ? lon : null, meta: { currency: "EUR" },
        bays: bays.map((b) => ({ id: b.id, zone: b.zone, polygon: b.points.map((p) => p.map(Math.round)) })),
      }, null, 2);
    }

    function draw() {
      const svg = $("stage").querySelector("svg");
      if (!svg) return;
      svg.replaceChildren();
      for (const b of bays) {
        const poly = document.createElementNS(NS, "polygon");
        poly.setAttribute("points", b.points.map((p) => p.join(",")).join(" "));
        svg.append(poly);
        const cx = b.points.reduce((s, p) => s + p[0], 0) / b.points.length;
        const cy = b.points.reduce((s, p) => s + p[1], 0) / b.points.length;
        const t = document.createElementNS(NS, "text");
        t.setAttribute("x", cx - 8); t.setAttribute("y", cy + 4); t.textContent = b.id;
        svg.append(t);
      }
      for (const p of pending) {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]); c.setAttribute("r", 4);
        svg.append(c);
      }
      $("count").textContent = `${bays.length} bays${pending.length ? `, ${pending.length}/4 points` : ""}`;
      $("out").value = json();
    }

    $("file").addEventListener("change", () => {
      const f = $("file").files[0];
      if (!f) return;
      const img = new Image();
      img.onload = () => {
        size = [img.naturalWidth, img.naturalHeight];
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("width", size[0]); svg.setAttribute("height", size[1]);
        svg.setAttribute("viewBox", `0 0 ${size[0]} ${size[1]}`);
        svg.addEventListener("click", (e) => {
          const r = svg.getBoundingClientRect();
          pending.push([(e.clientX - r.left) * size[0] / r.width, (e.clientY - r.top) * size[1] / r.height]);
          if (pending.length === 4) {
            bays.push({ id: String(bays.length + 1), zone: $("zone").value.trim() || "main", points: pending });
            pending = [];
          }
          draw();
        });
        $("stage").replaceChildren(img, svg);
        draw();
      };
      img.src = URL.createObjectURL(f);
    });

    $("undo").addEventListener("click", () => { if (pending.length) pending.pop(); else bays.pop(); draw(); });
    $("clear").addEventListener("click", () => { bays = []; pending = []; draw(); });
    for (const id of ["lotId", "lotName", "lat", "lon"]) $(id).addEventListener("input", draw);
    $("download").addEventListener("click", () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([json()], { type: "application/json" }));
      a.download = `${$("lotId").value.trim() || "lot"}.json`;
      a.click();
    });
  </script>
</body>
</html>
